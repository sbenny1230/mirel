name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, format, dead code, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Expo dependency compatibility
        run: npx expo-doctor
      - name: Dependency vulnerabilities (high and above)
        run: npm audit --audit-level=high --omit=dev

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Scan
        run: >
          semgrep scan --error --metrics=off
          --config p/default
          --config p/typescript
          --config p/react
          --config p/secrets
          --config p/sql-injection
